services:
  - type: web
    name: hackerrank-orchestrate-september26-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn buy_or_wait_api.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
